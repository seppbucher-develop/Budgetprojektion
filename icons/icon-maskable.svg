<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">

  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="coinGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" fill="url(#bgGrad)"/>
  <g transform="translate(249,247) scale(0.85)">

    <!-- Note -->
    <g transform="translate(-30,-10) rotate(-16)">
      <rect x="-150" y="-85" width="300" height="170" rx="18" fill="#f8fbff" stroke="#1e3a8a" stroke-width="7"/>
      <rect x="-124" y="-59" width="248" height="118" rx="10" fill="none" stroke="#93c5fd" stroke-width="4"/>
      <circle cx="-45" cy="0" r="38" fill="none" stroke="#60a5fa" stroke-width="6"/>
      <circle cx="-45" cy="0" r="15" fill="#bfdbfe"/>
      <line x1="30" y1="-40" x2="105" y2="-40" stroke="#bfdbfe" stroke-width="6" stroke-linecap="round"/>
      <line x1="30" y1="40" x2="90" y2="40" stroke="#bfdbfe" stroke-width="6" stroke-linecap="round"/>
    </g>
    <!-- Coins -->
    <g>
      <circle cx="60" cy="90" r="64" fill="url(#coinGrad)" stroke="#92400e" stroke-width="6"/>
      <circle cx="105" cy="40" r="64" fill="url(#coinGrad)" stroke="#92400e" stroke-width="6"/>
      <g>
        <circle cx="150" cy="-10" r="64" fill="url(#coinGrad)" stroke="#92400e" stroke-width="6"/>
        <circle cx="150" cy="-10" r="46" fill="none" stroke="#fde68a" stroke-width="4"/>
        <circle cx="150" cy="-10" r="10" fill="#fde68a"/>
      </g>
    </g>

  </g>
</svg>
